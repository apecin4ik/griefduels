# Мир, в котором находится арена
world: grief-1

arena:
  # Центр арены. y = уровень, на котором стоят игроки (пол будет на 1 блок ниже).
  # Проще всего: встать на нужное место и написать /duel setcenter
  center:
    x: 0
    y: 100
    z: 0
  radius: 24   # минимум 20
  height: 14   # минимум 10

# Куда телепортировать после дуэли (/duel setspawn)
spawn:
  world: world
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Режим «Дуэль на RTP»: обоих игроков телепортирует в случайное место этого мира
rtp:
  world: grief-1
  center-x: 0
  center-z: 0
  min-distance: 300     # минимум от центра
  max-distance: 3000    # максимум от центра (учитывается границы мира)
  separation: 10        # расстояние между игроками при старте

# Приват арены. Никто не может ходить/ломать/ставить/телепортироваться в арену, кроме дуэлянтов.
protection:
  admin-bypass: false   # true — игроки с правом duel.admin тоже могут заходить в арену (для ремонта)

settings:
  open-duel-expire: 120      # через сколько секунд вызов пропадает
  teleport-countdown: 5      # таймер до телепорта на арену
  freeze-seconds: 0          # заморозка перед боем (0 = бить можно сразу после телепорта)
  loot-seconds: 20           # сколько победитель собирает дроп
  max-duel-seconds: 600      # лимит боя, потом ничья
  command-whitelist: []      # команды, разрешённые во время дуэли (без /)
  cancel-on-move: false      # отменять телепорт, если игрок двигался
  cancel-on-damage: false    # отменять телепорт, если игрок получил урон

# Режим «Дуэль с китами»: отдельная временная арена высоко в небе мира kits.arena.world.
# Арена строится заново для каждой дуэли в случайной точке и сносится после боя.
# Кит выдаётся автоматически, настоящие вещи игрока сохраняются и возвращаются после дуэли.
# Содержимое китов хранится в kits.yml (/duel setkit 1..3), здесь — только названия и иконки.
kits:
  arena:
    world: grief-1
    center-x: 0           # от какой точки считаются расстояния
    center-z: 0
    min-distance: 300     # минимум от центра по горизонтали
    max-distance: 3000    # максимум от центра (учитывается граница мира)
    min-y: 200            # высота пола арены: случайная от min-y до max-y
    max-y: 250            # ВАЖНО: потолок мира 1.16 = 256, поэтому реально не выше (256 - 1 - height) = 243
    radius: 16            # минимум 12
    height: 12            # минимум 10
    keep-away: 40         # в радиусе стольких блоков от арены (во все стороны) чужим нельзя находиться
  end-seconds: 5          # сколько победитель стоит на арене после победы
  strict-commands: true   # true — в арене китов не работают команды даже у админов
  # Названия, иконки и описание китов в меню (содержимое — в kits.yml, см. /duel setkit и /duel defaultkits)
  names:
    '1':
      name: "&a&lСтарт"
      icon: LEATHER_CHESTPLATE
      lore:
        - "&7Кожаная броня и каменное оружие."
    '2':
      name: "&1&lJester"
      icon: DIAMOND_HELMET
      lore:
        - "&7Алмазный набор, зачарования послабее."
    '3':
      name: "&5&lGosudar"
      icon: DIAMOND_CHESTPLATE
      lore:
        - "&7Алмазный набор с сильными зачарованиями."
    '4':
      name: "&b❄ &4&lПодарок &f&lСанты &b❄"
      icon: SNOWBALL
      lore:
        - "&7Алмазная броня, зелья и два тотема."
    '5':
      name: "&4&lPalatin"
      icon: NETHERITE_CHESTPLATE
      lore:
        - "&7Незеритовый набор, два тотема и зелья."
    '6':
      name: "&7[&4&lYou&f&lTube&7]"
      icon: NETHERITE_SWORD
      lore:
        - "&7Максимальный незеритовый набор."

# Топ-10 по победам в дуэлях: в углу экрана (сайдбар справа) и командой /duel top
